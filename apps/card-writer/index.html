<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#312e81"><title>AKSIS Card Writer</title>
<style>
  #qr-reader { max-width: 500px; margin: 1rem 0; border-radius: 8px; overflow: hidden; display: none; }
  .camera-btn { margin-bottom: 1rem; }
  .qr-input-row { display: flex; align-items: center; gap: 0.5rem; }
</style>
</head><body><main><header><b>AKSIS Card Writer</b><span id="status" role="status">Siap</span></header><section><h1>Stasiun produksi kartu</h1><p>Scan QR yang sudah tercetak. Server memilih job untuk kartu tersebut sebelum penulisan chip.</p><label>Device ID <input id="device" autocomplete="off"></label><label>Token perangkat <input id="secret" type="password" autocomplete="off"></label><button id="connect">Hubungkan alat USB / serial</button><hr>
<button id="btn-toggle-camera" type="button" class="camera-btn">Buka Kamera Scanner</button>
<div id="qr-reader"></div>
<div class="qr-input-row"><label>Atau scan dengan alat scanner <input id="qr" autocomplete="off"></label></div>
<article id="job"></article><button id="next">Periksa kartu & tulis chip</button><label>Scan ulang QR setelah penulisan <input id="verify-qr" autocomplete="off"></label><button id="complete">Baca ulang chip & verifikasi</button><button id="retry" hidden>Kirim ulang hasil tertunda</button><button id="release-local">Pulihkan setelah lease kedaluwarsa</button><pre id="log" role="status"></pre></section></main><script type="module" src="/src/main.ts"></script></body></html>
