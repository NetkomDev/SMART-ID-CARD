<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#164736"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <title>AKSIS · Kontrol Orang Tua</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #164736;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    .aksis-initial-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 40%, #1c523e 0%, #103327 100%);
      color: #ffffff;
      text-align: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .aksis-loader-logo {
      height: 72px;
      width: auto;
      object-fit: contain;
      margin-bottom: 1.75rem;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35));
    }
    .aksis-loader-spinner {
      width: 40px;
      height: 40px;
      border: 3.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #34d399;
      border-radius: 50%;
      animation: aksisSpin 0.75s linear infinite;
      margin-bottom: 1rem;
    }
    .aksis-loader-title {
      font-size: 1rem;
      font-weight: 600;
      color: #ecfdf5;
      margin: 0 0 0.25rem 0;
    }
    .aksis-loader-subtitle {
      font-size: 0.8rem;
      color: #a7f3d0;
      margin: 0;
    }
    @keyframes aksisSpin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div class="aksis-initial-loader">
      <img src="/logo.png" alt="AKSIS Logo" class="aksis-loader-logo" />
      <div class="aksis-loader-spinner"></div>
      <h3 class="aksis-loader-title">Memuat Kontrol Orang Tua...</h3>
      <p class="aksis-loader-subtitle">AKSIS Smart School</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
