openapi: 3.1.0
info:
  title: AKSIS Core API
  version: 1.10.0
  description: >-
    Integrated Phase 03-13 REST contract covering authentication and tenant
    context, schools/classes/students, academic periods and student history,
    card lifecycle, and secure device provisioning/runtime operations.
  x-aksis-phases:
    - phase: 3
      resources: [Auth, Schools, Classes, Students]
    - phase: 4
      resources: [Academic Years, Student History, Cards]
    - phase: 5
      resources: [Devices]
    - phase: 6
      resources: [Gate Attendance, Offline Sync]
    - phase: 7
      resources: [Admin Context, Attendance Read Model, Device Inventory]
    - phase: 8
      resources: [Parent Linking, Children, Parent Timeline]
    - phase: 9
      resources: [Waste Transactions, Ranking, Summary]
    - phase: 10
      resources: [Extracurriculars, Sessions, Members, Attendance]
    - phase: 11
      resources: [Library Visits, Offline Sync, Class Summary]
    - phase: 12
      resources: [LED Content, Gateway State, Heartbeat, Acknowledgement]
    - phase: 13
      resources: [Command Center, Today Aggregate]
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
tags:
  - name: Auth
  - name: Schools
  - name: Classes
  - name: Students
  - name: Academic Years
  - name: Cards
  - name: Devices
  - name: Gate Attendance
  - name: Parents
  - name: Waste
  - name: Extracurriculars
  - name: Library
  - name: LED Gateway
  - name: Dashboard
security:
  - bearerAuth: []
    schoolId: []
paths:
  /health:
    get:
      operationId: health
      summary: API liveness probe
      security: []
      responses:
        '200':
          description: Process is accepting requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status: { type: string, const: ok }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate using Supabase Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session and available active schools
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Exchange a refresh token for a new session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string, minLength: 1 }
      responses:
        '200':
          description: Refreshed session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/AuthInvalid'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Resolve the current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke all refresh tokens for the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string, minLength: 1 }
      responses:
        '204': { description: Session revoked }
        '401':
          $ref: '#/components/responses/AuthRequired'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServerUnavailable'
  /schools/current:
    get:
      tags: [Schools]
      operationId: getCurrentSchool
      summary: Get the selected tenant details
      responses:
        '200':
          description: School details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /classes:
    get:
      tags: [Classes]
      operationId: listClasses
      summary: List classes in the selected tenant
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Paginated classes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Class' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Classes]
      operationId: createClass
      summary: Create a class
      description: Requires `academic.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassCreate' }
      responses:
        '201':
          description: Created class
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Classes]
      operationId: getClass
      summary: Get a class
      responses:
        '200':
          description: Class details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Classes]
      operationId: updateClass
      summary: Update a class
      description: Requires `academic.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassUpdate' }
      responses:
        '200':
          description: Updated class
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Classes]
      operationId: deleteClass
      summary: Soft-delete a class
      description: Requires `academic.manage`.
      responses:
        '204': { description: Class deactivated and soft-deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /students:
    get:
      tags: [Students]
      operationId: listStudents
      summary: List students
      description: Requires `student.read`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Paginated students
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Student' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Students]
      operationId: createStudent
      summary: Create a student
      description: Requires `student.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentCreate' }
      responses:
        '201':
          description: Created student
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /students/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Students]
      operationId: getStudent
      summary: Get a student
      description: Requires `student.read`.
      responses:
        '200':
          description: Student details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Students]
      operationId: updateStudent
      summary: Update a student
      description: Requires `student.update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentUpdate' }
      responses:
        '200':
          description: Updated student
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Students]
      operationId: deleteStudent
      summary: Soft-delete a student
      description: Requires `student.update`.
      responses:
        '204': { description: Student deactivated and soft-deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /academic-years:
    get:
      tags: [Academic Years]
      operationId: listAcademicYears
      summary: List academic years for the active tenant
      responses:
        '200': { description: Academic year list, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicYearListResponse' } } } }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Academic Years]
      operationId: createAcademicYear
      summary: Create an inactive academic year
      description: Requires `academic.manage`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicYearWrite' } } } }
      responses:
        '201': { description: Created academic year, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicYearResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /academic-years/switch:
    post:
      tags: [Academic Years]
      operationId: switchAcademicYear
      summary: Atomically select the active academic year
      description: Requires `academic.manage`; deactivates the previous period in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [academic_year_id]
              properties: { academic_year_id: { type: string, format: uuid } }
      responses:
        '200': { description: Newly active academic year, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicYearResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /academic-years/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      tags: [Academic Years]
      operationId: getAcademicYear
      summary: Get an academic year
      responses:
        '200': { description: Academic year, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicYearResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Academic Years]
      operationId: updateAcademicYear
      summary: Update an academic year
      description: Requires `academic.manage`. Activation must use the switch endpoint.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicYearUpdate' } } } }
      responses:
        '200': { description: Updated academic year, content: { application/json: { schema: { $ref: '#/components/schemas/AcademicYearResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Academic Years]
      operationId: deleteAcademicYear
      summary: Soft-delete an inactive academic year
      description: Requires `academic.manage`; an active period must be switched first.
      responses:
        '204': { description: Academic year soft-deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /students/{id}/history:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      tags: [Students]
      operationId: listStudentClassHistory
      summary: List a student's class history
      description: Requires `student.read`.
      responses:
        '200': { description: Student class history, content: { application/json: { schema: { $ref: '#/components/schemas/StudentHistoryListResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Students]
      operationId: recordStudentClassHistory
      summary: Atomically promote or assign a student to a class
      description: Requires `student.update`; closes the prior current assignment.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StudentHistoryWrite' } } } }
      responses:
        '201': { description: New current assignment, content: { application/json: { schema: { $ref: '#/components/schemas/StudentHistoryResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /cards:
    get:
      tags: [Cards]
      operationId: listCards
      summary: List cards for the active tenant
      description: Requires `card.read`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: student_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CardStatus' } }
      responses:
        '200': { description: Paginated cards, content: { application/json: { schema: { $ref: '#/components/schemas/CardListResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Cards]
      operationId: createCard
      summary: Issue a student card
      description: Requires `card.manage`; opaque `qr_key` must contain no PII.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CardWrite' } } } }
      responses:
        '201': { description: Issued card, content: { application/json: { schema: { $ref: '#/components/schemas/CardResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /cards/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      tags: [Cards]
      operationId: getCard
      summary: Get a card
      responses:
        '200': { description: Card details, content: { application/json: { schema: { $ref: '#/components/schemas/CardResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Cards]
      operationId: updateCardStatus
      summary: Change card status or expiration
      description: Requires `card.manage`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CardUpdate' } } } }
      responses:
        '200': { description: Updated card, content: { application/json: { schema: { $ref: '#/components/schemas/CardResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Cards]
      operationId: blockCard
      summary: Block a card without deleting its history
      responses:
        '204': { description: Card blocked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices/register:
    post:
      tags: [Devices]
      operationId: registerDevice
      summary: Register a device and issue its initial credential once
      description: Uses human bearer/tenant authentication and requires `device.manage`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceRegister' } } } }
      responses:
        '201': { description: Device and one-time plaintext credential, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceRegistrationResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /devices/heartbeat:
    post:
      tags: [Devices]
      operationId: deviceHeartbeat
      summary: Authenticate a device and record telemetry
      security: [{ deviceAuth: [], deviceId: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceHeartbeat' } } } }
      responses:
        '200': { description: Heartbeat accepted, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceHeartbeatResponse' } } } }
        '401': { $ref: '#/components/responses/AuthInvalid' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /devices/config:
    get:
      tags: [Devices]
      operationId: getDeviceConfig
      summary: Authenticate a device and obtain only its tenant-scoped configuration
      security: [{ deviceAuth: [], deviceId: [] }]
      responses:
        '200': { description: Device configuration, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceConfigResponse' } } } }
        '401': { $ref: '#/components/responses/AuthInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /device/attendance:
    post:
      tags: [Gate Attendance]
      operationId: recordGateAttendance
      summary: Process a real-time student card tap
      description: >-
        Authenticates a GATE device, resolves an active card/student in the
        device tenant, applies the device-specific or school-default gate rule,
        and records an idempotent attendance event.
      security: [{ deviceAuth: [], deviceId: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GateAttendanceEvent' }
      responses:
        '200':
          description: Idempotent replay or duplicate scan; no new attendance row was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateAttendanceResponse' }
        '201':
          description: New attendance transaction created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateAttendanceResponse' }
        '401': { $ref: '#/components/responses/AuthInvalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /device/attendance/sync:
    post:
      tags: [Gate Attendance]
      operationId: syncGateAttendance
      summary: Idempotently ingest an ordered offline event batch
      description: >-
        Accepts 1-500 locally queued events. Events are processed by
        `local_sequence`; each event receives an acknowledgement so the gate can
        mark only successful queue entries as SYNCED. Authentication or invalid
        device mode rejects the complete request.
      security: [{ deviceAuth: [], deviceId: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GateAttendanceBatch' }
      responses:
        '200':
          description: Per-event synchronization results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateAttendanceBatchResponse' }
        '401': { $ref: '#/components/responses/AuthInvalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /schools/current/context:
    get:
      tags: [Schools]
      operationId: getCurrentAdminContext
      summary: Resolve roles and permissions for the selected school membership
      responses:
        '200': { description: Active tenant authorization context, content: { application/json: { schema: { $ref: '#/components/schemas/AdminContextResponse' } } } }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List the selected school's device inventory
      description: Requires `device.read`; credential material is never returned.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200': { description: Paginated device inventory, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceListResponse' } } } }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /attendance:
    get:
      tags: [Gate Attendance]
      operationId: listAttendance
      summary: List tenant-scoped gate attendance for the admin portal
      description: Requires `attendance.read`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: direction, in: query, schema: { type: string, enum: [CHECK_IN, CHECK_OUT] } }
        - { name: occurred_from, in: query, schema: { type: string, format: date-time } }
        - { name: occurred_to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Paginated attendance read model, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceListResponse' } } } }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /parent/link:
    post:
      tags: [Parents]
      operationId: claimParentLink
      summary: Claim a one-time school-issued child link
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, full_name], properties: { token: { type: string, minLength: 32 }, full_name: { type: string }, phone: { type: [string, 'null'] } } } } } }
      responses:
        '201': { description: Child relationship activated }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /parent/children:
    get:
      tags: [Parents]
      operationId: listParentChildren
      summary: List only children actively linked to the authenticated parent
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Linked children }
        '401': { $ref: '#/components/responses/AuthRequired' }
  /parent/children/{id}/today:
    get:
      tags: [Parents]
      operationId: getParentChildToday
      summary: Get today's timeline for an actively linked child
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { description: Child timeline in school timezone }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /parent/link-tokens:
    post:
      tags: [Parents]
      operationId: createParentLinkToken
      summary: Issue a one-time parent link token
      description: Requires `parent.manage` in the selected school.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [student_id, relationship], properties: { student_id: { type: string, format: uuid }, relationship: { type: string, enum: [FATHER, MOTHER, GUARDIAN, OTHER] }, expires_in_hours: { type: integer, minimum: 1, maximum: 168, default: 24 } } } } } }
      responses:
        '201': { description: Token returned once }
        '403': { $ref: '#/components/responses/Forbidden' }
  /waste/transactions:
    post:
      tags: [Waste]
      operationId: createWasteTransaction
      summary: Record an idempotent student waste deposit
      responses: { '201': { description: Transaction committed }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /waste/ranking:
    get:
      tags: [Waste]
      operationId: getWasteRanking
      summary: Get class ranking
      responses: { '200': { description: Ranking reconciled from transactions } }
  /waste/summary:
    get:
      tags: [Waste]
      operationId: getWasteSummary
      summary: Get tenant waste totals
      responses: { '200': { description: Organic, inorganic, and total kilograms } }
  /extracurriculars:
    get:
      tags: [Extracurriculars]
      operationId: listExtracurriculars
      summary: List tenant extracurricular activities
      responses: { '200': { description: Activities }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [Extracurriculars]
      operationId: createExtracurricular
      summary: Create an extracurricular activity
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExtracurricularInput' } } } }
      responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } }
  /extracurriculars/{id}:
    patch:
      tags: [Extracurriculars]
      operationId: updateExtracurricular
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExtracurricularInput' } } } }
      responses: { '200': { description: Updated }, '404': { $ref: '#/components/responses/NotFound' } }
  /extracurriculars/{id}/sessions:
    get:
      tags: [Extracurriculars]
      operationId: listExtracurricularSessions
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses: { '200': { description: Sessions ordered by start time } }
    post:
      tags: [Extracurriculars]
      operationId: createExtracurricularSession
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExtracurricularSessionInput' } } } }
      responses: { '201': { description: Session created }, '422': { $ref: '#/components/responses/ValidationError' } }
  /extracurriculars/{id}/members:
    get:
      tags: [Extracurriculars]
      operationId: listExtracurricularMembers
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses: { '200': { description: Active and inactive memberships with student identity } }
  /extracurriculars/{id}/members/fast-enroll:
    post:
      tags: [Extracurriculars]
      operationId: fastEnrollExtracurricularMember
      description: Explicit confirmation and idempotency key are mandatory.
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FastEnrollmentInput' } } } }
      responses: { '200': { description: Existing idempotent result }, '201': { description: Member enrolled }, '409': { $ref: '#/components/responses/Conflict' } }
  /extracurriculars/{id}/sessions/{sessionId}/attendance:
    post:
      tags: [Extracurriculars]
      operationId: recordExtracurricularAttendance
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExtracurricularAttendanceInput' } } } }
      responses: { '201': { description: Attendance recorded }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /extracurriculars/{id}/sessions/{sessionId}/summary:
    get:
      tags: [Extracurriculars]
      operationId: getExtracurricularSessionSummary
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Present, excused, absent, and total counts } }
  /device/library/visits:
    post:
      tags: [Library]
      operationId: recordLibraryVisit
      summary: Record a real-time authenticated terminal visit
      security: [{ deviceAuth: [], deviceId: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryVisitInput' } } } }
      responses: { '200': { description: Idempotent replay }, '201': { description: Visit recorded }, '401': { $ref: '#/components/responses/DeviceAuthRequired' } }
  /device/library/visits/sync:
    post:
      tags: [Library]
      operationId: syncLibraryVisits
      summary: Synchronize one to 500 queued terminal visits
      security: [{ deviceAuth: [], deviceId: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [events], properties: { events: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/LibraryVisitInput' } } } } } } }
      responses: { '200': { description: Ordered sync results }, '401': { $ref: '#/components/responses/DeviceAuthRequired' } }
  /library/summary:
    get:
      tags: [Library]
      operationId: getLibrarySummary
      summary: Aggregate tenant library visits by class
      parameters:
        - { name: occurred_from, in: query, schema: { type: string, format: date-time } }
        - { name: occurred_to, in: query, schema: { type: string, format: date-time } }
      responses: { '200': { description: Class visit totals }, '403': { $ref: '#/components/responses/Forbidden' } }
  /led/content:
    get:
      tags: [LED Gateway]
      operationId: listLedContent
      summary: List tenant LED content and override windows
      responses: { '200': { description: Content list }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [LED Gateway]
      operationId: createLedContent
      summary: Schedule LED content or an override
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LedContentInput' } } } }
      responses: { '201': { description: Content scheduled }, '422': { $ref: '#/components/responses/ValidationError' } }
  /led/content/{id}:
    patch:
      tags: [LED Gateway]
      operationId: updateLedContent
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses: { '200': { description: Content updated }, '404': { $ref: '#/components/responses/NotFound' } }
  /led/gateways:
    get:
      tags: [LED Gateway]
      operationId: listLedGatewayHealth
      summary: List tenant gateway heartbeats and controller state
      responses: { '200': { description: Gateway health records } }
  /device/led/state:
    get:
      tags: [LED Gateway]
      operationId: getLedGatewayState
      security: [{ deviceAuth: [], deviceId: [] }]
      responses: { '200': { description: Highest-priority active content or fallback }, '401': { $ref: '#/components/responses/DeviceAuthRequired' } }
  /device/led/heartbeat:
    post:
      tags: [LED Gateway]
      operationId: recordLedGatewayHeartbeat
      security: [{ deviceAuth: [], deviceId: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LedHeartbeatInput' } } } }
      responses: { '201': { description: Heartbeat recorded }, '401': { $ref: '#/components/responses/DeviceAuthRequired' } }
  /device/led/acknowledgements:
    post:
      tags: [LED Gateway]
      operationId: acknowledgeLedContent
      security: [{ deviceAuth: [], deviceId: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LedAcknowledgementInput' } } } }
      responses: { '201': { description: Controller result acknowledged }, '401': { $ref: '#/components/responses/DeviceAuthRequired' } }
  /dashboard/today:
    get:
      tags: [Dashboard]
      operationId: getDashboardToday
      summary: Return a cached tenant aggregate for today's operational metrics
      description: Requires `dashboard.read`; stale cache entries are refreshed server-side.
      responses:
        '200': { description: Attendance, late, waste, library, and extracurricular aggregate, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardTodayResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    schoolId:
      type: apiKey
      in: header
      name: X-School-Id
      description: UUID of the active school membership.
    deviceAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Per-device credential formatted as `Device <token>`.
    deviceId:
      type: apiKey
      in: header
      name: X-Device-Id
      description: Registered device UUID; school context is derived server-side.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: search
      in: query
      schema: { type: string, minLength: 1, maxLength: 100, pattern: '^[\p{L}\p{N}\s.-]+$' }
  responses:
    AuthRequired:
      description: Missing, expired, or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AuthInvalid:
      description: Invalid session credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InvalidCredentials:
      description: Invalid email or password
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Tenant membership or permission is missing
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found in the active tenant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Resource violates a uniqueness constraint
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Request payload, parameters, or query are invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Request quota exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerUnavailable:
      description: Upstream service unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    DashboardTodayResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [school_id, date, timezone, metrics, generated_at, stale_after, is_stale]
              properties:
                school_id: { type: string, format: uuid }
                date: { type: string, format: date }
                timezone: { type: string }
                generated_at: { type: string, format: date-time }
                stale_after: { type: string, format: date-time }
                is_stale: { type: boolean }
                metrics:
                  type: object
                  additionalProperties: true
    LedContentInput:
      type: object
      required: [priority, body]
      properties:
        priority: { type: string, enum: [RUNNING_TEXT, NORMAL_DASHBOARD, ACHIEVEMENT, ADMIN_OVERRIDE, EMERGENCY] }
        title: { type: [string, 'null'], maxLength: 160 }
        body: { type: string, minLength: 1, maxLength: 4000 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
    LedHeartbeatInput:
      type: object
      required: [firmware_version, controller_online, reported_at]
      properties:
        firmware_version: { type: string, maxLength: 50 }
        controller_online: { type: boolean }
        cached_content_id: { type: [string, 'null'], format: uuid }
        last_error: { type: [string, 'null'], maxLength: 1000 }
        reported_at: { type: string, format: date-time }
    LedAcknowledgementInput:
      type: object
      required: [content_id, content_version, success]
      properties:
        content_id: { type: string, format: uuid }
        content_version: { type: integer, minimum: 1 }
        success: { type: boolean }
        error_code: { type: [string, 'null'], maxLength: 80 }
    LibraryVisitInput:
      type: object
      required: [event_id, card_uid, occurred_at, local_sequence]
      properties:
        event_id: { type: string, format: uuid }
        card_uid: { type: string, minLength: 4, maxLength: 64 }
        occurred_at: { type: string, format: date-time }
        local_sequence: { type: integer, minimum: 0 }
        metadata: { type: object, additionalProperties: true, default: {} }
    ExtracurricularInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 32, pattern: '^[A-Za-z0-9_-]+$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
    ExtracurricularSessionInput:
      type: object
      required: [name, starts_at, ends_at]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    FastEnrollmentInput:
      type: object
      required: [student_id, idempotency_key, confirmed]
      properties:
        student_id: { type: string, format: uuid }
        idempotency_key: { type: string, format: uuid }
        confirmed: { type: boolean, const: true }
    ExtracurricularAttendanceInput:
      type: object
      required: [student_id, status]
      properties:
        student_id: { type: string, format: uuid }
        status: { type: string, enum: [PRESENT, EXCUSED, ABSENT] }
        notes: { type: [string, 'null'], maxLength: 500 }
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, error, request_id]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [AUTH_REQUIRED, AUTH_INVALID, INVALID_CREDENTIALS, SESSION_REFRESH_FAILED, FORBIDDEN, TENANT_REQUIRED, SCHOOL_NOT_FOUND, ACADEMIC_YEAR_NOT_FOUND, CLASS_NOT_FOUND, STUDENT_NOT_FOUND, CARD_NOT_FOUND, DEVICE_NOT_REGISTERED, DEVICE_AUTH_INVALID, DEVICE_NOT_GATE, ATTENDANCE_DISABLED, CARD_BLOCKED, STUDENT_INACTIVE, GATE_RULE_VIOLATION, PARENT_LINK_INVALID, CHILD_NOT_LINKED, RESOURCE_NOT_FOUND, INVALID_JSON, PAYLOAD_TOO_LARGE, VALIDATION_ERROR, CONFLICT, RATE_LIMITED, ROUTE_NOT_FOUND, DATABASE_ERROR, SERVER_UNAVAILABLE, INTERNAL_ERROR]
            message: { type: string }
            details: {}
        request_id: { type: string }
    PaginationMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128, format: password }
    Session:
      type: object
      required: [access_token, refresh_token, token_type]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_at: { type: integer }
        token_type: { type: string }
    User:
      type: object
      description: Supabase Auth user representation.
      required: [id]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, 'null'], format: email }
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [user, session, schools]
              properties:
                user: { $ref: '#/components/schemas/User' }
                session: { $ref: '#/components/schemas/Session' }
                schools:
                  type: array
                  items:
                    type: object
                    properties:
                      school_id: { type: string, format: uuid }
                      schools: { $ref: '#/components/schemas/School' }
    SessionResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Session' }
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                user: { $ref: '#/components/schemas/User' }
    School:
      type: object
      required: [id, code, name, status, timezone, is_active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, INACTIVE] }
        timezone: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SchoolResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/School' }
    Class:
      type: object
      required: [id, school_id, academic_year_id, code, name, is_active]
      properties:
        id: { type: string, format: uuid }
        school_id: { type: string, format: uuid }
        academic_year_id: { type: string, format: uuid }
        code: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 120 }
        grade_level: { type: [integer, 'null'], minimum: 1, maximum: 12 }
        homeroom_teacher_user_id: { type: [string, 'null'], format: uuid }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClassPayload:
      type: object
      additionalProperties: false
      properties:
        academic_year_id: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1, maxLength: 120 }
        grade_level: { type: [integer, 'null'], minimum: 1, maximum: 12 }
        homeroom_teacher_user_id: { type: [string, 'null'], format: uuid }
        is_active: { type: boolean }
    ClassCreate:
      allOf:
        - $ref: '#/components/schemas/ClassPayload'
      required: [academic_year_id, code, name]
    ClassUpdate:
      allOf:
        - $ref: '#/components/schemas/ClassPayload'
      minProperties: 1
    ClassResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Class' }
    Student:
      type: object
      required: [id, school_id, student_number, full_name, gender, is_active]
      properties:
        id: { type: string, format: uuid }
        school_id: { type: string, format: uuid }
        nisn: { type: [string, 'null'], pattern: '^\\d{10}$' }
        student_number: { type: string, maxLength: 50 }
        full_name: { type: string, maxLength: 200 }
        gender: { type: string, enum: [MALE, FEMALE, OTHER, UNDISCLOSED] }
        date_of_birth: { type: [string, 'null'], format: date }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StudentPayload:
      type: object
      additionalProperties: false
      properties:
        nisn: { type: [string, 'null'], pattern: '^\\d{10}$' }
        student_number: { type: string, minLength: 1, maxLength: 50 }
        full_name: { type: string, minLength: 1, maxLength: 200 }
        gender: { type: string, enum: [MALE, FEMALE, OTHER, UNDISCLOSED] }
        date_of_birth: { type: [string, 'null'], format: date }
        is_active: { type: boolean }
    StudentCreate:
      allOf:
        - $ref: '#/components/schemas/StudentPayload'
      required: [student_number, full_name]
    StudentUpdate:
      allOf:
        - $ref: '#/components/schemas/StudentPayload'
      minProperties: 1
    StudentResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Student' }
    AcademicYear:
      type: object
      required: [id, school_id, name, start_date, end_date, is_active]
      properties:
        id: { type: string, format: uuid }
        school_id: { type: string, format: uuid }
        name: { type: string, maxLength: 32 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AcademicYearPayload:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 32 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    AcademicYearWrite:
      allOf: [{ $ref: '#/components/schemas/AcademicYearPayload' }]
      required: [name, start_date, end_date]
    AcademicYearUpdate:
      allOf: [{ $ref: '#/components/schemas/AcademicYearPayload' }]
      minProperties: 1
    AcademicYearResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - { type: object, properties: { data: { $ref: '#/components/schemas/AcademicYear' } } }
    AcademicYearListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AcademicYear' } } } }
    StudentHistory:
      type: object
      required: [id, school_id, student_id, class_id, academic_year_id, start_date, is_current]
      properties:
        id: { type: string, format: uuid }
        school_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        academic_year_id: { type: string, format: uuid }
        start_date: { type: string, format: date }
        end_date: { type: [string, 'null'], format: date }
        is_current: { type: boolean }
    StudentHistoryWrite:
      type: object
      additionalProperties: false
      required: [class_id, academic_year_id, start_date]
      properties:
        class_id: { type: string, format: uuid }
        academic_year_id: { type: string, format: uuid }
        start_date: { type: string, format: date }
    StudentHistoryResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - { type: object, properties: { data: { $ref: '#/components/schemas/StudentHistory' } } }
    StudentHistoryListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/StudentHistory' } } } }
    CardStatus: { type: string, enum: [ACTIVE, LOST, BLOCKED, REPLACED, EXPIRED] }
    Card:
      type: object
      required: [id, school_id, student_id, card_uid, card_serial, qr_key, status]
      properties:
        id: { type: string, format: uuid }
        school_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        card_uid: { type: string }
        card_serial: { type: string }
        qr_key: { type: string, description: Opaque random identifier containing no PII. }
        status: { $ref: '#/components/schemas/CardStatus' }
        issued_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
    CardWrite:
      type: object
      additionalProperties: false
      required: [student_id, card_uid, card_serial, qr_key]
      properties:
        student_id: { type: string, format: uuid }
        card_uid: { type: string, minLength: 1, maxLength: 64 }
        card_serial: { type: string, minLength: 1, maxLength: 100 }
        qr_key: { type: string, minLength: 16, maxLength: 128 }
        status: { $ref: '#/components/schemas/CardStatus' }
        issued_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
    CardUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/CardStatus' }
        expires_at: { type: [string, 'null'], format: date-time }
    CardResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - { type: object, properties: { data: { $ref: '#/components/schemas/Card' } } }
    CardListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/Card' } }
            meta: { $ref: '#/components/schemas/PaginationMeta' }
    DeviceType: { type: string, enum: [GATE, LIBRARY, LED, CARD_STATION, WASTE_SCALE, OTHER] }
    DeviceRegister:
      type: object
      additionalProperties: false
      required: [device_code, device_type, name]
      properties:
        device_code: { type: string, minLength: 1, maxLength: 64 }
        device_type: { $ref: '#/components/schemas/DeviceType' }
        name: { type: string, minLength: 1, maxLength: 120 }
        location: { type: [string, 'null'], maxLength: 200 }
        hardware_version: { type: [string, 'null'], maxLength: 50 }
        firmware_version: { type: [string, 'null'], maxLength: 50 }
        update_channel: { type: string, default: stable, maxLength: 32 }
        config: { type: object, additionalProperties: true }
    DeviceHeartbeat:
      type: object
      additionalProperties: false
      required: [uptime_seconds, firmware_version, reported_at]
      properties:
        uptime_seconds: { type: integer, minimum: 0 }
        signal_strength: { type: [integer, 'null'], minimum: -150, maximum: 0 }
        firmware_version: { type: string, minLength: 1, maxLength: 50 }
        storage_status: { type: object, additionalProperties: true }
        last_error: { type: [string, 'null'], maxLength: 1000 }
        reported_at: { type: string, format: date-time }
    DeviceRegistrationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                device: { type: object, additionalProperties: true }
                credential:
                  type: object
                  required: [token, scheme]
                  properties:
                    token: { type: string, description: Returned once; store in device secure storage. }
                    scheme: { type: string, const: Device }
    DeviceHeartbeatResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [accepted, received_at]
              properties:
                accepted: { type: boolean, const: true }
                received_at: { type: string, format: date-time }
    DeviceConfigResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [device_id, school_id, device_code, device_type, config]
              properties:
                device_id: { type: string, format: uuid }
                school_id: { type: string, format: uuid }
                device_code: { type: string }
                device_type: { $ref: '#/components/schemas/DeviceType' }
                config: { type: object, additionalProperties: true }
                update_channel: { type: string }
                firmware_version: { type: [string, 'null'] }
    GateAttendanceEvent:
      type: object
      additionalProperties: false
      required: [event_id, card_uid, occurred_at, local_sequence]
      properties:
        event_id: { type: string, format: uuid, description: Client-generated idempotency key. }
        card_uid: { type: string, minLength: 1, maxLength: 64 }
        occurred_at: { type: string, format: date-time, description: RTC/NTP timestamp including UTC offset. }
        local_sequence: { type: integer, minimum: 0 }
        metadata: { type: object, additionalProperties: true, default: {} }
    GateAttendanceBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/GateAttendanceEvent' }
    GateAttendanceResult:
      type: object
      required: [event_id, attendance_id, direction, student_id, is_late, duplicate, occurred_at_server]
      properties:
        event_id: { type: string, format: uuid }
        attendance_id: { type: string, format: uuid }
        direction: { type: string, enum: [CHECK_IN, CHECK_OUT] }
        student_id: { type: string, format: uuid }
        student_name: { type: string }
        class_id: { type: [string, 'null'], format: uuid }
        is_late: { type: boolean }
        duplicate: { type: boolean }
        duplicate_reason: { type: string, enum: [EVENT_ID, SCAN_WINDOW, ATTENDANCE_STATE] }
        occurred_at_server: { type: string, format: date-time }
    GateAttendanceResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/GateAttendanceResult' }
    GateAttendanceSyncItem:
      oneOf:
        - type: object
          required: [success, event_id, result]
          properties:
            success: { type: boolean, const: true }
            event_id: { type: string, format: uuid }
            result: { $ref: '#/components/schemas/GateAttendanceResult' }
        - type: object
          required: [success, event_id, error_code, message]
          properties:
            success: { type: boolean, const: false }
            event_id: { type: string, format: uuid }
            error_code:
              type: string
              enum: [CARD_NOT_FOUND, CARD_BLOCKED, STUDENT_INACTIVE, GATE_RULE_VIOLATION, VALIDATION_ERROR, SERVER_UNAVAILABLE]
            message: { type: string }
    GateAttendanceBatchResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [results, processed]
              properties:
                results:
                  type: array
                  items: { $ref: '#/components/schemas/GateAttendanceSyncItem' }
                processed: { type: integer, minimum: 1, maximum: 500 }
    AdminContextResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [school_id, membership_id, roles, permissions]
              properties:
                school_id: { type: string, format: uuid }
                membership_id: { type: string, format: uuid }
                roles: { type: array, items: { type: string } }
                permissions: { type: array, items: { type: string } }
    DeviceInventoryItem:
      type: object
      required: [id, school_id, device_code, device_type, name, status]
      properties:
        id: { type: string, format: uuid }
        school_id: { type: string, format: uuid }
        device_code: { type: string }
        device_type: { $ref: '#/components/schemas/DeviceType' }
        name: { type: string }
        location: { type: [string, 'null'] }
        firmware_version: { type: [string, 'null'] }
        hardware_version: { type: [string, 'null'] }
        update_channel: { type: string }
        status: { type: string, enum: [PROVISIONING, ACTIVE, DISABLED, MAINTENANCE, RETIRED] }
        last_seen_at: { type: [string, 'null'], format: date-time }
    DeviceListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/DeviceInventoryItem' } }
            meta: { $ref: '#/components/schemas/PaginationMeta' }
    AttendanceReadItem:
      type: object
      required: [id, direction, source, occurred_at_local, is_late]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        direction: { type: string, enum: [CHECK_IN, CHECK_OUT] }
        source: { type: string, enum: [REALTIME, OFFLINE_SYNC] }
        occurred_at_local: { type: string, format: date-time }
        occurred_at_server: { type: string, format: date-time }
        is_late: { type: boolean }
        students: { type: [object, 'null'], additionalProperties: true }
        classes: { type: [object, 'null'], additionalProperties: true }
        devices: { type: [object, 'null'], additionalProperties: true }
    AttendanceListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/AttendanceReadItem' } }
            meta: { $ref: '#/components/schemas/PaginationMeta' }
