name: Verify AKSIS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: fixture-not-real
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-contrib-17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:db:all
        env:
          AKSIS_PG_BIN: /usr/lib/postgresql/17/bin
          AKSIS_DB_LOG_DIR: /tmp/aksis-db-evidence/clean
      - run: npm run test:db:upgrade
        env:
          AKSIS_PG_BIN: /usr/lib/postgresql/17/bin
          AKSIS_DB_LOG_DIR: /tmp/aksis-db-evidence/upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-evidence
          path: /tmp/aksis-db-evidence
